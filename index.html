.brand .name{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:0.01em}

    'llama-3b':  { id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC',   size: '~2GB',   label: '3B · balanced · default · most laptops' },
    'qwen-7b':   { id: 'Qwen2.5-7B-Instruct-q4f16_1-MLC',     size: '~5GB',   label: '7B · capable · needs decent GPU (M-series Mac / 8GB+ VRAM)' },
    'llama-8b':  { id: 'Llama-3.1-8B-Instruct-q4f16_1-MLC',   size: '~5GB',   label: '8B · common · needs decent GPU' },
    'llama-70b': { id: 'Llama-3.1-70B-Instruct-q4f16_1-MLC',  size: '~40GB',  label: '70B · frontier · needs serious GPU + 64GB+ RAM' },
  };
  const DEFAULT_MODEL = 'llama-3b';

  const T3_PROVIDERS = {
    anthropic: { label: 'Anthropic Claude', models: ['claude-sonnet-4-5','claude-opus-4-7','claude-haiku-4-5'], default: 'claude-sonnet-4-5', url: 'https://api.anthropic.com/v1/messages' },
    openai:    { label: 'OpenAI',           models: ['gpt-4o','gpt-4o-mini','o1-mini'],                          default: 'gpt-4o-mini',      url: 'https://api.openai.com/v1/chat/completions' },
    google:    { label: 'Google Gemini',    models: ['gemini-1.5-pro','gemini-1.5-flash','gemini-2.0-flash-exp'], default: 'gemini-1.5-flash', url: 'https://generativelanguage.googleapis.com/v1beta/models/' },
  };

  // ─── State ───────────────────────────────────────────────────────
  const STATE = {
    config: loadConfig(),
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null },
  };

  function loadConfig() {
    try { return JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); }
    catch (e) { return {}; }
  }
  function saveConfig() {
    try { localStorage.setItem('fall-kit.config', JSON.stringify(STATE.config)); } catch (e) {}
  }

  // ─── DOM helpers ─────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ─────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      if (STATE.config.api_key) { txt.textContent = 'T3 ' + (T3_PROVIDERS[STATE.config.api_provider]?.label || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine;
      STATE.ai.model = model.id;
      STATE.ai.ready = true;
      STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig();
      renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMsg }],
        max_tokens: maxTokens,
      });
      return r.choices[0].message.content;
    }
    if (tier === 'T3' && STATE.config.api_key && STATE.config.api_provider) {
      return await aiCloudCall(systemPrompt, userMsg, maxTokens);
    }
    return null;
  }

  async function aiCloudCall(sys, msg, maxTokens) {
    const provider = STATE.config.api_provider;
    const key = STATE.config.api_key;
    const model = STATE.config.api_model || T3_PROVIDERS[provider]?.default;
    if (provider === 'anthropic') {
      const r = await fetch(T3_PROVIDERS.anthropic.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model, max_tokens: maxTokens, system: sys, messages: [{ role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('Anthropic ' + r.status + ': ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return j.content[0].text;
    }
    if (provider === 'openai') {
      const r = await fetch(T3_PROVIDERS.openai.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: 'system', content: sys }, { role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return j.choices[0].message.content;
    }
    if (provider === 'google') {
      const r = await fetch(T3_PROVIDERS.google.url + model + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: sys + '\n\n---\n\n' + msg }] }], generationConfig: { maxOutputTokens: maxTokens } }),
      });
      if (!r.ok) throw new Error('Google ' + r.status);
      const j = await r.json();
      return j.candidates[0].content.parts[0].text;
    }
    throw new Error('unknown provider: ' + provider);
  }

  // ─── WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN) ───
  const MESH_CHANNEL = 'fall-signal';
  const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ───────────────────────────────────────────────────────

      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── KCC Mint launcher (v1.2 · fork-this-seed shortcut) ──────────
  function openMint() {

    return { version: FALL_KIT_VERSION, mounted: true };
  }

  // ─── Public API ──────────────────────────────────────────────────

const TOOLNAME='fallonboard';

// ════════════════════════════════════════════════════════════════
// UTIL
// ════════════════════════════════════════════════════════════════
const $=(s,p=document)=>p.querySelector(s);
const $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
const uid=(p='id')=>p+'_'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,16):Math.random().toString(36).slice(2,18));
const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>{if(!t)return'—';const d=new Date(t);return d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'2-digit'})};
const fmtDateTime=t=>{if(!t)return'—';const d=new Date(t);return d.toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
const fmtDateISO=t=>{if(!t)return'';const d=new Date(t);return d.toISOString().slice(0,10)};
const ageYears=dob=>{if(!dob)return null;const d=new Date(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a};
const addDays=(t,d)=>t+d*86400000;
const daysBetween=(a,b)=>Math.round((b-a)/86400000);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),2200)}

async function sha256(s){const buf=s instanceof ArrayBuffer?s:new TextEncoder().encode(typeof s==='string'?s:JSON.stringify(s));const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function sha256Blob(blob){const buf=await blob.arrayBuffer();return sha256(buf)}

function bytes(n){if(n<1024)return n+'B';if(n<1024*1024)return(n/1024).toFixed(1)+'KB';return(n/1048576).toFixed(2)+'MB'}

// ════════════════════════════════════════════════════════════════
// INDEXEDDB · stores: state, audit, documents
// ════════════════════════════════════════════════════════════════
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(STORE,1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');
      if(!d.objectStoreNames.contains('audit'))d.createObjectStore('audit',{keyPath:'i'});
      if(!d.objectStoreNames.contains('documents'))d.createObjectStore('documents',{keyPath:'id'});
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=e=>rej(e);
  });
}
function idbPut(store,val,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=key?tx.objectStore(store).put(val,key):tx.objectStore(store).put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbDel(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function idbClear(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

async function persistState(){
  if(!db)await openDB();
  const snap={
    schemaVersion:state.schemaVersion,
    active:state.active,
    firm:state.firm,
    advisers:state.advisers,
    clients:state.clients,
    chat:state.chat,
    settings:state.settings,
  };
  // mirror to localStorage as fallback
  try{localStorage.setItem(STORE+'.state',JSON.stringify(snap))}catch(e){}
  return idbPut('state',snap,'main');
}
async function loadState(){
  if(!db)await openDB();
  let s=await idbGet('state','main');
  if(!s){
    try{const raw=localStorage.getItem(STORE+'.state');if(raw)s=JSON.parse(raw)}catch(e){}
  }
  if(s){
    state.schemaVersion=s.schemaVersion||SCHEMA_V;
    state.active=s.active||'clients';
    state.firm=s.firm||null;
    state.advisers=Array.isArray(s.advisers)?s.advisers:[];
    state.clients=Array.isArray(s.clients)?s.clients:[];
    state.chat=Array.isArray(s.chat)?s.chat:[];
    state.settings=Object.assign({},state.settings,s.settings||{});
  }
  state.audit=await idbAll('audit');
  state.audit.sort((a,b)=>a.i-b.i);
}

// ════════════════════════════════════════════════════════════════
// AUDIT CHAIN · Mansoor P3 extended (FCA-shaped)
// ════════════════════════════════════════════════════════════════
async function appendAudit(action, info){
  if(!state.settings.auditChain)return;
  if(!db)await openDB();
  const i=state.audit.length?state.audit[state.audit.length-1].i+1:1;
  const prevHash=state.audit.length?state.audit[state.audit.length-1].docHash:'';
  const payload=info.payload||{};
  const entry={
    i,
    ts:Date.now(),
    tool:TOOLNAME,
    adviserId:info.adviserId||'',
    clientId:info.clientId||'',
    action,
    reasoning:info.reasoning||'',
    configVersion:`${TOOLNAME}@${VERSION}`,
    prevHash,
    docHash:'',
    payload
  };
  entry.docHash=await sha256(JSON.stringify({prevHash,ts:entry.ts,action,clientId:entry.clientId,payload}));
  state.audit.push(entry);
  if(state.audit.length>AUDIT_CAP){
    // prune oldest from IDB
    const drop=state.audit.length-AUDIT_CAP;
    for(let k=0;k<drop;k++){await idbDel('audit',state.audit[k].i)}
    state.audit=state.audit.slice(drop);
  }
  await idbPut('audit',entry);
}

// ════════════════════════════════════════════════════════════════
// BROADCAST MESH · fall-client + fall-signal
// ════════════════════════════════════════════════════════════════
let bcClient=null, bcSignal=null;
let _bcDebounce={};
function bcInit(){
  try{
    bcClient=new BroadcastChannel('fall-client');
    bcClient.addEventListener('message',handleClientMsg);
    bcSignal=new BroadcastChannel('fall-signal');
    bcSignal.addEventListener('message',handleSignalMsg);
    // boot signals
    bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()});
    bcClient.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME,payload:{}});
  }catch(e){console.warn('BroadcastChannel unavailable',e)}
}
function bcSend(type,payload){
  if(!bcClient)return;
  const key=type+'|'+(payload?.id||'');
  clearTimeout(_bcDebounce[key]);
  _bcDebounce[key]=setTimeout(()=>{
    try{bcClient.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload})}catch(e){}
  },300);
}
function bcSendNow(type,payload){
  if(!bcClient)return;
  try{bcClient.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload})}catch(e){}
}
async function handleClientMsg(e){
  const m=e.data;if(!m||m.source===TOOLNAME)return;
  switch(m.type){
    case 'sync.request':{
      bcSendNow('sync.snapshot',{clients:state.clients,advisers:state.advisers,firm:state.firm});
      break;
    }
    case 'sync.snapshot':{
      mergeSnapshot(m.payload||{});
      render();
      break;
    }
    case 'client.created':
    case 'client.updated':{
      mergeRecord('clients',m.payload);render();break;
    }
    case 'client.archived':{
      mergeRecord('clients',m.payload);render();break;
    }
    case 'adviser.created':
    case 'adviser.updated':
    case 'adviser.archived':{
      mergeRecord('advisers',m.payload);render();break;
    }
    case 'firm.updated':{
      if(!state.firm||(m.payload?.updatedAt||0)>(state.firm?.updatedAt||0)){state.firm=m.payload;persistState();render()}
      break;
    }
  }
}
function handleSignalMsg(e){
  const m=e.data;if(!m||m.source===TOOLNAME)return;
  if(m.type==='ping'&&bcSignal)bcSignal.postMessage({source:TOOLNAME,type:'pong',prime:PRIME,version:VERSION,ts:now()});
}
function mergeRecord(coll,rec){
  if(!rec||!rec.id)return;
  const arr=state[coll];const i=arr.findIndex(x=>x.id===rec.id);
  if(i<0){arr.push(rec);persistState();return}
  if((rec.updatedAt||0)>(arr[i].updatedAt||0)){arr[i]=rec;persistState()}
}
function mergeSnapshot(p){
  if(Array.isArray(p.clients))p.clients.forEach(c=>mergeRecord('clients',c));
  if(Array.isArray(p.advisers))p.advisers.forEach(a=>mergeRecord('advisers',a));
  if(p.firm)mergeRecord_firm(p.firm);
}
function mergeRecord_firm(f){
  if(!f)return;
  if(!state.firm||(f.updatedAt||0)>(state.firm.updatedAt||0)){state.firm=f;persistState()}
}

// ════════════════════════════════════════════════════════════════
// AML RISK SCORING · suggestion engine
// ════════════════════════════════════════════════════════════════
function suggestRiskGrade(c){
  const k=c.kyc||{};
  let score=0;
  const reasons=[];
  if(k.pepFlag){score+=3;reasons.push('PEP flagged (+3)')}
  if(k.sanctionsStatus==='match'){score+=4;reasons.push('Sanctions match (+4)')}
  if(k.sanctionsStatus==='review'){score+=2;reasons.push('Sanctions review (+2)')}
  if(k.sanctionsStatus==='not-checked'){score+=1;reasons.push('Sanctions not checked (+1)')}
  if(k.vulnerableCustomerFlag){score+=1;reasons.push('Vulnerable customer (+1)')}
  if(HIGH_RISK_JURIS.includes(c.nationality)){score+=3;reasons.push('Nationality high-risk jurisdiction (+3)')}
  if(HIGH_RISK_JURIS.includes(c.countryOfResidence)){score+=3;reasons.push('Residence high-risk jurisdiction (+3)')}
  if((c.taxResidency||[]).some(x=>HIGH_RISK_JURIS.includes(x))){score+=2;reasons.push('Tax residency high-risk (+2)')}
  if(['business-sale','gift','other'].includes(k.sourceOfFunds)){score+=1;reasons.push('Higher-scrutiny source of funds (+1)')}
  const grade=score>=4?'high':(score>=2?'medium':'low');
  return {grade,score,reasons};
}

function computeReviewDates(c){
  const grade=c.kyc?.riskGrade||'low';
  const days=REVIEW_CADENCE[grade]||365;
  const last=c.kyc?.lastReviewAt||c.createdAt||now();
  return {lastReviewAt:last,nextReviewDue:addDays(last,days)};
}

// ════════════════════════════════════════════════════════════════

async function saveClient(c,action,reasoning){
  c.updatedAt=now();
  const i=state.clients.findIndex(x=>x.id===c.id);
  const isNew=i<0;
  if(isNew){state.clients.push(c)}else{state.clients[i]=c}
  await persistState();
  await appendAudit(action||(isNew?'client.created':'client.updated'),{
    clientId:c.id,adviserId:c.adviserId,
    reasoning:reasoning||(isNew?'Client onboarding completed':'Client record updated'),
    payload:{id:c.id,name:`${c.firstName} ${c.lastName}`.trim(),kycStatus:c.kyc?.status,risk:c.kyc?.riskGrade}
  });
  bcSend(isNew?'client.created':'client.updated',c);
  return c;
}
async function archiveClient(c,reasoning){
  c.archivedAt=now();c.updatedAt=now();
  await persistState();
  await appendAudit('client.archived',{clientId:c.id,adviserId:c.adviserId,reasoning:reasoning||'Soft-archived (FCA 7yr retention)',payload:{id:c.id}});
  bcSend('client.archived',c);
}
async function saveAdviser(a,reasoning){
  a.updatedAt=now();
  const i=state.advisers.findIndex(x=>x.id===a.id);
  const isNew=i<0;
  if(isNew)state.advisers.push(a);else state.advisers[i]=a;
  await persistState();
  await appendAudit(isNew?'adviser.created':'adviser.updated',{adviserId:a.id,reasoning:reasoning||'Adviser saved',payload:{id:a.id,name:a.name,role:a.smcrRole}});
  bcSend(isNew?'adviser.created':'adviser.updated',a);

// document blob storage in IDB
async function storeDocument(file,clientId,type,note){
  const id=uid('dc');
  const hash=await sha256Blob(file);
  const rec={id,clientId,filename:file.name,type,mime:file.type||'',size:file.size,sha256:hash,capturedAt:now(),note:note||'',blob:file};
  await idbPut('documents',rec);
  // return reference only (not blob)
  const expDays=DOC_EXPIRY[type];
  return {id,type,filename:file.name,blobRef:id,sha256:hash,size:file.size,mime:rec.mime,capturedAt:rec.capturedAt,expiresAt:expDays?addDays(rec.capturedAt,expDays):null,verifiedBy:'',note:note||''};
}
async function fetchDocument(id){return idbGet('documents',id)}
async function downloadDocument(id){
  const r=await fetchDocument(id);if(!r){toast('Document not found');return}
  const u=URL.createObjectURL(r.blob);const a=document.createElement('a');a.href=u;a.download=r.filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);
}
async function deleteDocument(id){await idbDel('documents',id)}

const T0_RULES=[
  {match:/what(?:'s| is) a pep|politically.?exposed/i,title:'PEP (Politically Exposed Person)',answer:()=>`**PEP — Politically Exposed Person** (Money Laundering Regulations 2017, reg.35)

Someone entrusted with prominent public functions, plus their **family members** and **known close associates**.

**Categories:**
- Heads of state, ministers, deputy ministers
- Members of parliament, supreme courts, central bank boards
- Ambassadors, military officers of high rank
- Senior executives of state-owned enterprises
- International organisation officials (UN, EU, IMF, etc.)

**Family:** spouse / civil partner, children + their spouses, parents
**Close associates:** beneficial ownership of a legal entity jointly with PEP, sole BO of entity set up for PEP's benefit, business relationships with PEP

**Required action when PEP identified:**
1. Senior management approval to onboard/continue
2. Enhanced Due Diligence (EDD)
3. Establish source of funds AND source of wealth
4. Enhanced ongoing monitoring

Domestic PEPs (UK) require EDD but FCA has clarified lower-risk treatment than foreign PEPs unless other factors raise the risk.`},
  {match:/document.*(uk individual|new client)|what document|need.*aml/i,title:'AML documents for a UK individual',answer:()=>`**Standard CDD evidence for a UK natural person** (JMLSG Part I §5.3):

**Identity (one):**
- Valid UK passport
- UK driving licence (photocard)
- EEA/Swiss national ID card
- HMRC tax notification
- Firearms certificate

**Address (one, dated within 3 months):**
- Utility bill (gas/elec/water · NOT mobile phone)
- Council tax bill (current year)
- Bank/building society statement (paper)
- HMRC correspondence
- Tenancy agreement from regulated landlord
- Mortgage statement

**Two-source rule:** identity + address from **different sources** for full CDD. For SDD a single robust source may suffice.

**Electronic verification:** acceptable per JMLSG §5.3.31 if from a regulated provider with multi-source matching (e.g. Experian, LexisNexis, GBG). One e-ID source = one of the two; physical address evidence still recommended.

**Retention:** **5 years from end of business relationship** (MLR 2017 reg.40); FCA SYSC requires 7 years for related supervisory records.`},
  {match:/source of funds.*wealth|sof.*sow|funds vs wealth/i,title:'Source of funds vs source of wealth',answer:()=>`**Source of funds (SoF)** = where the **money for this specific transaction** comes from. Concrete, recent, traceable.
- "£50k from the sale of my BTL flat at 12 Oak Rd, completed 14 March 2026, conveyancer Smith & Co."

**Source of wealth (SoW)** = how the client's **overall wealth was accumulated over their lifetime**. Strategic, cumulative.
- "27 years as NHS consultant + inheritance from mother 2019 + property growth since 2003."

**FCA expectations** (FG17/5):
- **CDD:** SoF is usually enough.
- **EDD (PEP, high-risk juris, high-value, complex structures):** require BOTH, with documentary evidence proportionate to risk.
- **Don't accept "savings" as a final answer** — drill: savings *from what*, *over what period*?

**Documentary corroboration:**
- Inheritance → grant of probate, executor's letter
- Property sale → completion statement, TR1
- Business sale → SPA, accountant's letter
- Earnings → P60s, payslips, tax returns
- Gift → donor's declaration + proof their wealth supports the gift`},
  {match:/vulnerab|fg21|fg ?21\/?1/i,title:'FCA vulnerable customer framework (FG21/1)',answer:()=>`**FCA FG21/1** — fair treatment of vulnerable customers. Now embedded in **Consumer Duty** (PRIN 2A).

**The 4 drivers of vulnerability:**

1. **Health** — physical disability, mental health, addiction, cognitive impairment, terminal illness
2. **Life events** — bereavement, divorce, job loss, having a baby, becoming a carer, retirement
3. **Resilience** — low/erratic income, over-indebtedness, low savings, lack of emotional resilience
4. **Capability** — low knowledge of financial matters, low confidence with digital/numerical/literacy skills, learning disabilities

**Action checklist:**
- Record the flag + category + specific notes
- Adjust communication (e.g. larger print, slower pace, phone over email, trusted third party present)
- Train staff to spot warning signs (sundowning, repetition, distress, third-party pressure)
- Tailor product suitability (e.g. avoid long lock-ins for someone with deteriorating health)
- Periodic review — vulnerability can be permanent, temporary, or fluctuating
- Document the adjustments you made

**Consumer Duty link:** firms must avoid foreseeable harm and act in good faith — vulnerability handling is a primary lens.`},
  {match:/retain|retention|how long.*keep|store.*record|7 ?year/i,title:'KYC document retention',answer:()=>`**Retention periods (UK):**

| Record | Min retention | Source |
|---|---|---|
| CDD evidence (ID, address, beneficial ownership) | **5 years from end of business relationship** | MLR 2017 reg.40 |
| Transaction records | **5 years from transaction date** | MLR 2017 reg.40 |
| Business-wide risk assessment | **5 years** | MLR 2017 reg.18 |
| FCA-regulated firm records (suitability, comms) | **5 years (MiFID), 6 years for COBS, indefinitely for pension transfers** | COBS 9, SYSC 9 |
| SARs / internal reports | **5 years from making the report** | POCA 2002 |
| Cyber/data records under DPA | "no longer than necessary" — usually align with the above | DPA 2018 |

**Practical rule for an IFA:** **7 years** from end of relationship is the safe default — covers MLR (5yr), COBS (6yr), pension transfer scrutiny, and most ombudsman complaint horizons.

**Format:** electronic is fine if tamper-evident and accessible. FallOnboard's audit chain + IDB + JSON export gives you this if you export periodically to off-device cold storage.`},
  {match:/sanction|consolidated list|hmt|ofsi/i,title:'UK sanctions screening',answer:()=>`**OFSI Consolidated List** — HM Treasury maintains the UK's official sanctions list. Asset-freeze targets across all UK regimes (Russia, Iran, terrorism, etc.).

**Where to check:**
- Web: https://www.gov.uk/government/publications/the-uk-sanctions-list
- OFSI consolidated list: https://www.gov.uk/government/publications/financial-sanctions-consolidated-list-of-targets
- Search tool: https://sanctionssearch.ofsi.hmtreasury.gov.uk/

**What to screen:**
- Client name + DOB + nationality
- All beneficial owners (>25% for legal entities)
- PEP family + close associates
- Counterparties to transactions

**Frequency:** at onboarding + ongoing (list is updated weekly).

**On a match:** **DO NOT** tip off the client. Report to OFSI immediately (max 14 days, sooner if asked). Freeze assets. Consider a SAR to NCA.

**FallOnboard records:** flag, status (clear/match/review/not-checked), adviser id, timestamp. Re-trigger sanctions check button updates timestamp. Manual workflow — automated screening requires a paid feed (Refinitiv World-Check, ComplyAdvantage, etc.).`},
  {match:/risk grad|risk rating|low.*medium.*high|edd|sdd/i,title:'AML risk grading — CDD / SDD / EDD',answer:()=>`**Three tiers under MLR 2017:**

**SDD — Simplified Due Diligence** (reg.37) — lower risk only:
- UK-listed plc, UK public authority, UK credit institution
- UK occupational pension schemes
- Client geography fully in low-risk juris + transparent ownership
- Effect: lighter ID checks, reduced ongoing monitoring frequency

**CDD — Standard** (reg.28) — the default:
- Identify and verify identity (and address) from independent reliable source
- Identify beneficial owners (legal persons)
- Understand nature & purpose of relationship
- Ongoing monitoring proportionate to risk

**EDD — Enhanced Due Diligence** (reg.33-36) — required for:
- PEPs / family / known close associates
- High-risk third countries (UK list mirrors FATF + UK additions)
- Complex/unusually large/no apparent economic purpose transactions
- Higher-risk indicators triggered by your risk assessment

**EDD adds:**
- Senior management approval to onboard
- Source of funds AND source of wealth with documentary corroboration
- Enhanced ongoing monitoring (frequency, depth, escalation)

**FallOnboard's auto-suggestion:** computes a score from PEP / sanctions / jurisdiction / source of funds and recommends a grade. **Adviser MUST override or confirm** — auto-score is a starting point, not the determination.`},
  {match:/jmlsg|joint money/i,title:'JMLSG guidance',answer:()=>`**Joint Money Laundering Steering Group** — the UK financial-sector body that publishes the practical AML/CTF guidance HM Treasury approves.

**Structure:**
- **Part I** — general guidance applicable to all firms
- **Part II** — sector-specific (banking, insurance, investment management, IFAs, etc.)
- **Part III** — specialist guidance (crypto, electronic verification, etc.)

**Why it matters:** FCA expects you to "have regard to" approved JMLSG guidance. Departing from it requires defensible justification.

**Key sections for IFAs:**
- Part I §5 — CDD requirements
- Part I §6 — EDD and PEPs
- Part II §5 — IFA-specific (suitability + KYC overlap)
- Part III on e-ID — when electronic verification can satisfy ID requirements

**Update cadence:** revised annually (June). Always check version date. https://www.jmlsg.org.uk/guidance/current-guidance/`},
  {match:/poca|tipping off|sar|suspicious activity/i,title:'POCA / SARs / tipping off',answer:()=>`**Proceeds of Crime Act 2002** — the criminal-law spine of UK AML.

**Three key offences for a regulated adviser:**

**s.327-329 — principal money-laundering offences** — concealing, arranging, acquiring/using/possessing criminal property. Strict liability for regulated sector if you fail to report knowledge/suspicion.

**s.330 — failure to disclose** — regulated-sector duty to report knowledge or suspicion of money laundering. Up to 5 years prison.

**s.333A — tipping off** — disclosing that a SAR has been made, where this might prejudice an investigation. Up to 2 years prison.

**SAR — Suspicious Activity Report:**
- Submitted via NCA's SARonline portal
- Internal report to MLRO first (your firm's SMF17), MLRO files external SAR if appropriate
- DAML — Defence Against Money Laundering — request consent before proceeding with a transaction (7 working days NCA response, then 31 days moratorium if refused)
- Free defence against the principal offences if you have **appropriate consent**

**Practical workflow:**
1. Adviser concern → internal MLRO referral (within firm)
2. MLRO assesses → external SAR if grounds
3. **Do not discuss with client** — tipping off risk
4. Continue normal service until told otherwise — sudden termination itself can tip off`},
  {match:/consumer duty|prin 2a|fair value/i,title:'Consumer Duty (PRIN 2A)',answer:()=>`**Consumer Duty** — FCA's PRIN 2A, in force since 31 July 2023 (and 31 July 2024 for closed products).

**The Duty:** "A firm must act to deliver good outcomes for retail customers."

**Three cross-cutting rules:**
1. Act in good faith
2. Avoid foreseeable harm
3. Enable and support customers to pursue their financial objectives

**Four outcomes:**
1. **Products & services** — fit for purpose for target market
2. **Price & value** — fair value assessment, documented
3. **Consumer understanding** — communications tested for clarity
4. **Consumer support** — no unreasonable barriers to action

**Onboarding implications:**
- Vulnerability assessment isn't optional — it's the lens
- Document the target market for each product you recommend
- Fair value: confirm the ongoing service justifies the ongoing fee
- Annual Consumer Duty board report (firms with 4+ approved persons)

**Vulnerable customers integrate directly into Duty:** FG21/1 + PRIN 2A together require you to identify, record, and adapt.`},
  {match:/cobs|suitability|attitude.*risk|capacity for loss/i,title:'COBS 9 suitability essentials',answer:()=>`**COBS 9 / 9A** — Conduct of Business Sourcebook chapter on suitability. Applies whenever you make a personal recommendation or manage on a discretionary basis.

**Required information from client ("know your client"):**

**Knowledge & experience** — what products they understand, prior dealings.
**Financial situation** — assets, debts, income, ability to bear loss.
**Investment objectives** — horizon, risk tolerance, purpose.

**Three pillars of a suitable recommendation:**
1. Meets the client's **investment objectives**
2. Client can **financially bear** any related investment risks consistent with their objectives
3. Client has the **knowledge & experience** to understand the risks

**Suitability report** (COBS 9.4) — written, must explain why suitable, advantages/disadvantages, AND the costs (MiFID II disclosure).

**Annual review** for ongoing advice — required by Consumer Duty even where not explicitly contracted. Document **ATR**, **capacity for loss**, **knowledge & experience** afresh. FallOnboard's suitability section captures these (ATR 1-7 scale per DT/Defaqto convention).`},
  {match:/audit chain|provenance|tamper|hash chain/i,title:'Audit chain · why prevHash',answer:()=>`**FallOnboard's audit chain** stores every write as an immutable entry:

\`\`\`
{ i, ts, tool, adviserId, clientId, action, reasoning,
  configVersion, prevHash, docHash, payload }
\`\`\`

\`docHash = sha256(prevHash || ts || action || clientId || payload)\`

**Why prevHash:**
- Any tampering with entry N invalidates every entry after N
- Equivalent to a Merkle log without the tree
- Export the chain → external auditor recomputes hashes → integrity proof

**FCA SYSC requirements:**
- SYSC 9.1.1R — adequate records to demonstrate compliance
- SYSC 3.2.20R — records of changes to client recommendations
- COBS 9.5.2R — suitability records for **5 years (MiFID) / indefinitely for pension transfers**

**Export workflow:** Settings → "Download audit chain" → encrypted JSON to cold storage off-device. Recompute hashes annually as part of compliance file review.

**Cap:** 50,000 entries (configurable). At ~10/client/year that's 5,000 client-years — comfortably fits a 1-10 person firm.`},
];

async function answer(q){
  for(const r of T0_RULES){if(r.match.test(q))return{src:'T0 · '+r.title,text:r.answer()}}
  const tier=Cascade.detectTier();
  if(tier==='T3'){
    const sys=`You are FallOnboard, a sovereign UK FCA-shaped client onboarding tool. You help an IFA / wealth-management firm with KYC, AML, source-of-funds, vulnerable-customer (FG21/1), Consumer Duty (PRIN 2A), COBS suitability, JMLSG guidance, and audit-trail discipline. **You are informational — not regulated compliance advice.** Always cite the source (MLR 2017 reg.N, FCA handbook reference, JMLSG part/section, case name). Be concrete and UK-specific. End with: "Verify with your MLRO / compliance officer before relying."`;
    const ctx=`Firm: ${state.firm?.name||'(not set up)'}. Active clients: ${state.clients.filter(c=>!c.archivedAt).length}. Advisers: ${state.advisers.length}.`;
    const r=await Cascade.generate(sys,ctx+'\n\nQuestion: '+q,1400);
    if(r.text)return{src:r.tier,text:r.text}
  }
  return{src:'T0 · fallback',text:`I don't have a canned rule for that question. Add an API key in **Settings** (Gemini is free) to enable T3 grounded answers.

Supported T0 topics:
${T0_RULES.map(r=>'• '+r.title).join('\n')}`};
}

  }).join('');
  updateTierBadge();

// WIZARD · 9 steps
// ════════════════════════════════════════════════════════════════
const WIZARD_STEPS=[
  {k:'identity',l:'Identity'},
  {k:'contact',l:'Contact'},
  {k:'relationships',l:'Relationships'},
  {k:'kyc',l:'KYC core'},
  {k:'source',l:'Source of funds'},
  {k:'vulnerability',l:'Vulnerability'},
  {k:'documents',l:'Documents'},
  {k:'risk',l:'AML risk'},
  {k:'confirm',l:'Confirm'},
];

function newClient(){
  if(!state.firm){toast('Set up firm first');go('firm');return}
  if(state.advisers.length===0){toast('Add an adviser first');go('advisers');return}
  state.ui.wizard={client:newClientRec(),step:0,editing:false};
  state.ui.activeClient=null;
  render();
}
function editClientWizard(id){
  const c=state.clients.find(x=>x.id===id);if(!c)return;
  state.ui.wizard={client:JSON.parse(JSON.stringify(c)),step:0,editing:true};
  state.ui.activeClient=null;
  render();
}

function renderWizardShell(){
  const w=state.ui.wizard;const s=WIZARD_STEPS[w.step];
  return `<div class="wizard">
    <div class="section-h"><div><h2>${w.editing?'Edit client':'Onboard new client'}</h2><div class="sub">step ${w.step+1} of ${WIZARD_STEPS.length} · ${s.l}</div></div>
      <div class="actions"><button class="btn ghost" onclick="cancelWizard()">cancel</button></div>
    </div>
    <div class="wizard-steps">${WIZARD_STEPS.map((x,i)=>`<div class="wstep ${i<w.step?'done':''} ${i===w.step?'active':''}" onclick="gotoStep(${i})"><span class="n">${i+1}</span>${esc(x.l)}</div>`).join('')}</div>
    <div class="wizard-body" id="wbody">${renderWizardStep()}</div>
    <div class="wizard-foot">
      <button class="btn ghost" onclick="prevStep()" ${w.step===0?'disabled':''}>← back</button>
      ${w.step<WIZARD_STEPS.length-1?`<button class="btn primary" onclick="nextStep()">next →</button>`:`<button class="btn primary" onclick="commitWizard()">${w.editing?'save changes':'commit onboarding'}</button>`}
    </div>
  </div>`
}
function gotoStep(i){captureStep();state.ui.wizard.step=i;render()}
function prevStep(){captureStep();if(state.ui.wizard.step>0)state.ui.wizard.step--;render()}
function nextStep(){if(!captureStep())return;if(state.ui.wizard.step<WIZARD_STEPS.length-1)state.ui.wizard.step++;render()}
function cancelWizard(){if(confirm('Discard onboarding in progress?')){state.ui.wizard=null;render()}}

function renderWizardStep(){
  const w=state.ui.wizard;const c=w.client;
  switch(WIZARD_STEPS[w.step].k){
    case 'identity': return stepIdentity(c);
    case 'contact': return stepContact(c);
    case 'relationships': return stepRelationships(c);
    case 'kyc': return stepKyc(c);
    case 'source': return stepSource(c);
    case 'vulnerability': return stepVulnerability(c);
    case 'documents': return stepDocuments(c);
    case 'risk': return stepRisk(c);
    case 'confirm': return stepConfirm(c);
  }
  return'';
}
function bindWizard(){
  // documents drop zone
  const dz=$('#dz');
  if(dz){
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('hover')});
    dz.addEventListener('dragleave',()=>dz.classList.remove('hover'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('hover');handleDocFiles(e.dataTransfer.files)});
    dz.addEventListener('click',()=>$('#dzPicker').click());
  }
  const picker=$('#dzPicker');
  if(picker)picker.addEventListener('change',e=>handleDocFiles(e.target.files));
}

// Capture form values into wizard.client per step
function captureStep(){
  const w=state.ui.wizard;if(!w)return true;
  const c=w.client;
  try{
    switch(WIZARD_STEPS[w.step].k){
      case 'identity':
        c.title=$('#w_title')?.value||c.title;
        c.firstName=$('#w_first')?.value?.trim()||'';
        c.lastName=$('#w_last')?.value?.trim()||'';
        c.middleName=$('#w_mid')?.value?.trim()||'';
        c.preferredName=$('#w_pref')?.value?.trim()||'';
        c.dob=$('#w_dob')?.value||'';
        c.nationality=($('#w_nat')?.value||'GB').toUpperCase().slice(0,2);
        c.countryOfResidence=($('#w_cor')?.value||'GB').toUpperCase().slice(0,2);
        c.nino=$('#w_nino')?.value?.trim().toUpperCase()||'';
        c.utr=$('#w_utr')?.value?.trim()||'';
        c.taxResidency=($('#w_tax')?.value||'GB').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
        c.gender=$('#w_gender')?.value?.trim()||'';
        break;
      case 'contact':
        c.email=$('#w_email')?.value?.trim()||'';
        c.phone=$('#w_phone')?.value?.trim()||'';
        c.address={
          line1:$('#w_a1')?.value?.trim()||'',line2:$('#w_a2')?.value?.trim()||'',
          city:$('#w_city')?.value?.trim()||'',postcode:($('#w_pc')?.value?.trim()||'').toUpperCase(),
          region:$('#w_region')?.value||'England',
          country:($('#w_country')?.value||'GB').toUpperCase().slice(0,2),
          since:$('#w_since')?.value||''
        };
        // history
        const hist=[];
        $$('.hist-from').forEach((el,i)=>{
          const to=$$('.hist-to')[i]?.value||'';
          const addr=$$('.hist-addr')[i]?.value?.trim()||'';
          if(el.value||to||addr)hist.push({from:el.value||'',to,address:addr});
        });
        c.addressHistory=hist;
        break;
      case 'relationships':
        const rels=[];
        $$('.rel-type').forEach((el,i)=>{
          const to=$$('.rel-to')[i]?.value||'';
          const notes=$$('.rel-notes')[i]?.value?.trim()||'';
          if(to)rels.push({type:el.value,toClientId:to,notes,startedAt:c.relationships?.[i]?.startedAt||now()});
        });
        c.relationships=rels;
        break;
      case 'kyc':
        c.kyc.pepFlag=$('#w_pep')?.checked||false;
        c.kyc.pepDetails=$('#w_pepd')?.value?.trim()||'';
        c.kyc.sanctionsStatus=$('#w_sancS')?.value||'not-checked';
        c.kyc.sanctionsCheckedBy=$('#w_sancBy')?.value||'';
        break;
      case 'source':
        c.kyc.sourceOfFunds=$('#w_sof')?.value||'';
        c.kyc.sourceOfFundsNotes=$('#w_sofn')?.value?.trim()||'';
        c.kyc.sourceOfWealth=$('#w_sow')?.value||'';
        c.kyc.sourceOfWealthNotes=$('#w_sown')?.value?.trim()||'';
        break;
      case 'vulnerability':
        c.kyc.vulnerableCustomerFlag=$('#w_vuln')?.checked||false;
        c.kyc.vulnerabilityCategory=$('#w_vc')?.value||'';
        c.kyc.vulnerabilityNotes=$('#w_vn')?.value?.trim()||'';
        break;
      case 'risk':
        c.kyc.riskGrade=$('#w_risk')?.value||'low';
        c.kyc.status=$('#w_kstatus')?.value||'pending';
        c.adviserId=$('#w_adv')?.value||c.adviserId;
        c.engagement.type=$('#w_etype')?.value||'ongoing';
        const r=computeReviewDates(c);
        c.kyc.lastReviewAt=r.lastReviewAt;c.kyc.nextReviewDue=r.nextReviewDue;
        break;
    }
  }catch(e){console.error('capture failed',e);return false}
  return true;
}

async function commitWizard(){
  if(!captureStep())return;
  const w=state.ui.wizard;const c=w.client;
  c.app.onboardCompleted=true;
  if(!c.kyc.nextReviewDue){const r=computeReviewDates(c);c.kyc.lastReviewAt=r.lastReviewAt;c.kyc.nextReviewDue=r.nextReviewDue}
  await saveClient(c, w.editing?'client.updated':'client.created', w.editing?'Onboarding wizard · edits saved':'Onboarding wizard · client committed');
  // demo purge if this was the first real client
  if(!c.app.isDemo){const purged=await purgeDemoIfPresent();if(purged)toast('Demo records purged · first real client')}
  state.ui.wizard=null;
  state.ui.activeClient=c.id;
  toast(w.editing?'Saved':'Onboarding committed');
  render();
}

async function exportAll(){
  const pass=$('#st_pass')?.value||'';
  const docs=await idbAll('documents');
  // serialise documents with blob → dataURL
  const docsSer=await Promise.all(docs.map(async d=>{
    const r=new FileReader();const p=new Promise(res=>{r.onload=()=>res(r.result)});r.readAsDataURL(d.blob);
    return {...d,blob:undefined,blobDataUrl:await p};
  }));
  const snap={
    meta:{tool:TOOLNAME,version:VERSION,exportedAt:now(),schemaVersion:SCHEMA_V,prime:PRIME},
    state:{firm:state.firm,advisers:state.advisers,clients:state.clients,settings:state.settings},
    audit:state.audit,
    documents:docsSer,
  };
  let blob, fname=`fallonboard-export-${fmtDateISO(now())}.json`;
  if(pass){
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(snap)));
    const payload={enc:'AES-GCM-PBKDF2',kdf:'PBKDF2-SHA256-200000',salt:btoa(String.fromCharCode(...salt)),iv:btoa(String.fromCharCode(...iv)),ct:btoa(String.fromCharCode(...new Uint8Array(ct))),meta:snap.meta};
    blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    fname=`fallonboard-export-${fmtDateISO(now())}.encrypted.json`;
  }else{
    blob=new Blob([JSON.stringify(snap,null,2)],{type:'application/json'});
  }
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);
  toast('Export downloaded · '+(pass?'encrypted':'plaintext'));
}

async function importAll(file){
  if(!file)return;
  if(!confirm('Importing will MERGE with current data. Records with same id are overwritten if imported version is newer. Continue?'))return;
  try{
    const txt=await file.text();
    let snap=JSON.parse(txt);
    if(snap.enc==='AES-GCM-PBKDF2'){
      const pass=prompt('Passphrase for encrypted export?');if(!pass)return;
      const enc=new TextEncoder();
      const salt=Uint8Array.from(atob(snap.salt),c=>c.charCodeAt(0));
      const iv=Uint8Array.from(atob(snap.iv),c=>c.charCodeAt(0));
      const ct=Uint8Array.from(atob(snap.ct),c=>c.charCodeAt(0));
      const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
      snap=JSON.parse(new TextDecoder().decode(pt));
    }
    if(!snap.meta||snap.meta.tool!==TOOLNAME)console.warn('Cross-tool import',snap.meta);
    if(snap.state){
      if(snap.state.firm)mergeRecord_firm(snap.state.firm);
      (snap.state.advisers||[]).forEach(a=>mergeRecord('advisers',a));
      (snap.state.clients||[]).forEach(c=>mergeRecord('clients',c));
    }
    if(Array.isArray(snap.audit)){
      // append entries that aren't already present
      const have=new Set(state.audit.map(a=>a.i+':'+a.docHash));
      for(const a of snap.audit){if(!have.has(a.i+':'+a.docHash)){await idbPut('audit',a);state.audit.push(a)}}
      state.audit.sort((x,y)=>x.i-y.i);
    }
    if(Array.isArray(snap.documents)){
      for(const d of snap.documents){
        const blob=await(await fetch(d.blobDataUrl)).blob();
        await idbPut('documents',{...d,blob,blobDataUrl:undefined});
      }
    }
    await persistState();
    await appendAudit('data.imported',{reasoning:`Imported from ${file.name}`});
    toast('Imported');closeModal();render();
  }catch(e){console.error(e);toast('Import failed: '+e.message)}
}

function downloadAudit(){
  const blob=new Blob([JSON.stringify({meta:{tool:TOOLNAME,version:VERSION,exportedAt:now(),count:state.audit.length},audit:state.audit},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`fallonboard-audit-${fmtDateISO(now())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);
  toast('Audit downloaded');
}

async function wipeAll(){
  if(!confirm('PERMANENT wipe of all FallOnboard data on this device. Clients, advisers, firm, audit, documents — all gone. Cannot be undone. Continue?'))return;
  if(!confirm('Are you absolutely sure? Type "WIPE" in the next prompt to confirm.'))return;
  const c=prompt('Type WIPE to confirm');if(c!=='WIPE')return;
  await idbClear('state');await idbClear('audit');await idbClear('documents');
  try{localStorage.removeItem(STORE+'.state')}catch(e){}
  toast('Wiped · reloading...');setTimeout(()=>location.reload(),900);
}

// si-didy postMessage + estate hooks
// ════════════════════════════════════════════════════════════════
window.addEventListener('message',async e=>{
  const m=e.data;if(!m||m.target!==TOOLNAME||!m.action)return;
  let r=null;
  if(m.action==='ping')r={ok:true,prime:PRIME,version:VERSION};
  else if(m.action==='get-clients')r={ok:true,clients:state.clients.filter(c=>!c.archivedAt)};
  else if(m.action==='get-firm')r={ok:true,firm:state.firm};
  else if(m.action==='get-advisers')r={ok:true,advisers:state.advisers.filter(a=>!a.archivedAt)};
  else if(m.action==='ask'&&m.question){const a=await answer(m.question);r={ok:true,answer:a.text,src:a.src}}
  e.source?.postMessage({target:m.source||'*',responseTo:m.action,data:r},'*');
});
